services:
  comfyui:
    profiles: ["legacy-image"]
    build:
      context: ./docker/comfyui
    container_name: local-short-studio-comfyui
    restart: unless-stopped
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--lowvram"]
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ./models/checkpoints:/opt/ComfyUI/models/checkpoints
      - ./models/loras:/opt/ComfyUI/models/loras
      - ./models/vae:/opt/ComfyUI/models/vae
      - ./output/comfy:/opt/ComfyUI/output
      - ./workflows:/workspace/workflows:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-short-studio-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
      - "127.0.0.1:${YOUTUBE_OAUTH_PORT:-8765}:${YOUTUBE_OAUTH_PORT:-8765}"
    volumes:
      - ./input:/workspace/input
      - ./output:/workspace/output
      - ./models/kokoro:/root/.cache/huggingface
      - ./config:/workspace/config:ro
      - ./assets/fonts:/workspace/assets/fonts:ro
    environment:
      TTS_DEVICE: ${TTS_DEVICE:-cuda}
      TTS_VOICE: ${TTS_VOICE:-pf_dora}
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-cuda}
      CHATTERBOX_BASE_REPO: ${CHATTERBOX_BASE_REPO:-ResembleAI/chatterbox}
      CHATTERBOX_PTBR_REPO: ${CHATTERBOX_PTBR_REPO:-ResembleAI/Chatterbox-Multilingual-pt-br}
      CHATTERBOX_CACHE_DIR: ${CHATTERBOX_CACHE_DIR:-/root/.cache/huggingface/local-short-studio/chatterbox-ptbr}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_CACHE_DIR: ${WHISPER_CACHE_DIR:-/root/.cache/huggingface/whisper}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-auto}
      RENDER_PROFILES: /workspace/config/render_profiles.json
      INPUT_DIR: /workspace/input
      OUTPUT_DIR: /workspace/output
      MUSIC_LIBRARY_DIR: ${MUSIC_LIBRARY_DIR:-/workspace/assets/music_library}
      MUSIC_MAX_CATALOG_BYTES: ${MUSIC_MAX_CATALOG_BYTES:-5242880}
      MUSIC_MAX_TRACK_BYTES: ${MUSIC_MAX_TRACK_BYTES:-104857600}
      YOUTUBE_DATA_DIR: ${YOUTUBE_DATA_DIR:-/workspace/input/youtube}
      YOUTUBE_CLIENT_SECRET_PATH: ${YOUTUBE_CLIENT_SECRET_PATH:-/workspace/input/youtube/client_secret.json}
      YOUTUBE_OAUTH_PORT: ${YOUTUBE_OAUTH_PORT:-8765}
      CAPTION_FONT: Montserrat
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import torch; assert torch.cuda.is_available()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
